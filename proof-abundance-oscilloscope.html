<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proof Abundance | Audio</title>
<style>
:root{color-scheme:dark;--ink:#b8d8c6;--dim:#648477;--line:#375a4d;--light:#d7f8e4;--bg:#060c0a}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:13px/1.6 'Courier New',monospace;display:grid;place-items:center;padding:30px 18px 45px}main{width:min(850px,100%)}.eyebrow{letter-spacing:.25em;color:var(--dim);font-size:11px}h1{font-size:clamp(20px,4vw,33px);font-weight:normal;letter-spacing:.1em;margin:8px 0 3px}header p{margin:0 0 25px;color:var(--dim)}.instrument{border:1px solid var(--line);background:#08110d;padding:12px;box-shadow:inset 0 0 35px #000}canvas{width:100%;height:auto;display:block;aspect-ratio:2.6;background:#050b08}.legend{display:flex;justify-content:space-between;color:var(--dim);font-size:10px;letter-spacing:.14em;margin:9px 3px 0}.controls{display:flex;align-items:center;gap:17px;margin:22px 0 9px}button{background:transparent;border:1px solid var(--line);color:var(--light);font:inherit;letter-spacing:.12em;padding:9px 17px;cursor:pointer;min-width:100px}button:hover,button:focus-visible{border-color:var(--light)}#clock{white-space:nowrap;color:var(--dim);font-size:12px}input[type=range]{width:100%;accent-color:#a2e0bd;cursor:pointer;margin:10px 0 5px;touch-action:none}input[type=range]:disabled{opacity:.4;cursor:default}.status{display:flex;justify-content:space-between;gap:15px;color:var(--dim);font-size:11px;letter-spacing:.07em}.captions{min-height:75px;margin:22px 0 18px;padding:16px 12px;text-align:center;border-top:1px solid #20392e;border-bottom:1px solid #20392e;color:var(--light);font-size:clamp(13px,2vw,16px);line-height:1.6}a{color:var(--ink);text-underline-offset:4px}footer{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;color:var(--dim);font-size:12px}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#8dd8a004 3px 4px);z-index:5}@media(max-width:540px){.controls{gap:10px;flex-wrap:wrap}.status{flex-wrap:wrap}footer{display:block}}
</style>
</head>
<body><main>
<header><div class="eyebrow">PORTABLE WARRANT / RECORDING 01</div><h1>PROOF ABUNDANCE</h1><p>Why Automated Verification Does Not Equal Understanding</p></header>
<div class="instrument"><canvas id="scope" width="1200" height="460" aria-label="Live audio oscilloscope with an accumulated trace"></canvas><div class="legend"><span>CHANNEL A / SIGNAL</span><span>CHANNEL B / RESIDUE</span><span>TIME BASE / AUTO</span></div></div>
<div class="controls"><button id="toggle" type="button">PLAY</button><span id="clock">00:00 / --:--</span></div>
<input id="seek" type="range" min="0" max="1000" step="1" value="0" disabled aria-label="Seek playback position">
<div class="status"><span id="audioStatus">AUDIO STANDBY</span><span id="subtitleStatus">LOADING SUBTITLES</span></div>
<div class="captions" id="captions" aria-live="off">Subtitles loading…</div>
<footer><span>LISTEN / READ</span><a href="https://standardgalactic.github.io/portable-warrant/proof-abundance.pdf" target="_blank" rel="noopener noreferrer">Proof Abundance (PDF)</a></footer>
<audio id="audio" preload="metadata" src="Why_Automated_Verification_Does_Not_Equal_Understanding.mp3"></audio>
</main><script>
'use strict';
const audio=document.getElementById('audio'),button=document.getElementById('toggle'),seek=document.getElementById('seek'),clock=document.getElementById('clock'),audioStatus=document.getElementById('audioStatus'),subtitleStatus=document.getElementById('subtitleStatus'),captions=document.getElementById('captions'),canvas=document.getElementById('scope'),g=canvas.getContext('2d');
let ac,analyser,buffer,source,dragging=false,desiredTime=null,seekTimeout=null,cues=[],captionText='';
const durationReady=()=>Number.isFinite(audio.duration)&&audio.duration>0;
const fmt=t=>Number.isFinite(t)?`${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')}`:'--:--';
function initAudio(){if(ac)return;ac=new (window.AudioContext||window.webkitAudioContext)();analyser=ac.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.6;buffer=new Uint8Array(analyser.fftSize);source=ac.createMediaElementSource(audio);source.connect(analyser);analyser.connect(ac.destination)}
async function toggle(){try{initAudio();if(ac.state==='suspended')await ac.resume();if(audio.paused)await audio.play();else audio.pause()}catch(e){audioStatus.textContent='PLAYBACK ERROR';console.error(e)}}
button.addEventListener('click',toggle);audio.addEventListener('play',()=>{button.textContent='PAUSE';audioStatus.textContent='SIGNAL ACTIVE'});audio.addEventListener('pause',()=>{button.textContent='PLAY';audioStatus.textContent=audio.ended?'COMPLETE':'PAUSED'});audio.addEventListener('error',()=>audioStatus.textContent='AUDIO FILE ERROR');
function updateClock(t=audio.currentTime){clock.textContent=`${fmt(t)} / ${fmt(audio.duration)}`}
function updateUI(){if(durationReady()){seek.disabled=false;if(!dragging&&desiredTime===null)seek.value=Math.round(1000*audio.currentTime/audio.duration)}updateClock(dragging||desiredTime!==null?Number(seek.value)/1000*audio.duration:audio.currentTime);updateCaption(dragging||desiredTime!==null?Number(seek.value)/1000*audio.duration:audio.currentTime)}
function requestSeek(t){if(!durationReady())return;const target=Math.max(0,Math.min(audio.duration,t));desiredTime=target;seek.value=Math.round(target/audio.duration*1000);updateClock(target);updateCaption(target);clearTimeout(seekTimeout);try{audio.currentTime=target;audioStatus.textContent='SEEKING'}catch(e){audioStatus.textContent='SEEK FAILED';console.error(e);desiredTime=null;return}seekTimeout=setTimeout(()=>{if(desiredTime!==null){audioStatus.textContent='SEEK NOT CONFIRMED';desiredTime=null}},3500)}
seek.addEventListener('pointerdown',()=>dragging=true);
seek.addEventListener('input',()=>{dragging=true;if(durationReady()){const t=Number(seek.value)/1000*audio.duration;updateClock(t);updateCaption(t)}});
seek.addEventListener('change',()=>{if(durationReady())requestSeek(Number(seek.value)/1000*audio.duration);dragging=false});
seek.addEventListener('pointerup',()=>{dragging=false});seek.addEventListener('pointercancel',()=>{dragging=false});
audio.addEventListener('seeked',()=>{if(desiredTime!==null){if(Math.abs(audio.currentTime-desiredTime)<1.5){desiredTime=null;clearTimeout(seekTimeout);audioStatus.textContent=audio.paused?'PAUSED':'SIGNAL ACTIVE'}else{audioStatus.textContent='SEEK POSITION MISMATCH'}}updateUI()});
audio.addEventListener('loadedmetadata',updateUI);audio.addEventListener('durationchange',updateUI);audio.addEventListener('timeupdate',updateUI);audio.addEventListener('ended',updateUI);
function timestamp(s){const p=s.trim().replace(',','.').split(':').map(Number);if(p.some(n=>!Number.isFinite(n)))return NaN;return p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:NaN}
async function loadCaptions(){try{const r=await fetch('Why_Automated_Verification_Does_Not_Equal_Understanding.vtt',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const text=(await r.text()).replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');for(const block of text.split(/\n\s*\n/)){const lines=block.trim().split('\n'),i=lines.findIndex(x=>x.includes('-->'));if(i<0)continue;const [a,b]=lines[i].split('-->');const start=timestamp(a),end=timestamp(b.trim().split(/\s+/)[0]);const content=lines.slice(i+1).join(' ').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();if(Number.isFinite(start)&&Number.isFinite(end)&&end>start&&content)cues.push({start,end,content})}cues.sort((a,b)=>a.start-b.start);subtitleStatus.textContent=cues.length?`${cues.length} SUBTITLE CUES READY`:'NO SUBTITLE CUES';captions.textContent=cues.length?'SELECT PLAY TO BEGIN':'No subtitles parsed.'}catch(e){subtitleStatus.textContent='SUBTITLES UNAVAILABLE';captions.textContent='Subtitles unavailable. Audio playback remains available.';console.error(e)}}
function updateCaption(t){if(!cues.length)return;let s='';for(const cue of cues){if(cue.start>t)break;if(t>=cue.start&&t<cue.end)s=cue.content}if(s!==captionText){captionText=s;captions.textContent=s||'\u00a0'}}
loadCaptions();
// The lower trace is a fading history of earlier waveforms, not a second audio channel.
const W=canvas.width,H=canvas.height;let last=performance.now(),history=[];
function render(now){requestAnimationFrame(render);g.fillStyle='#050b08';g.fillRect(0,0,W,H);g.strokeStyle='#1b3429';g.lineWidth=1;for(let x=0;x<=W;x+=60){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=0;y<=H;y+=46){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}g.strokeStyle='#3d6854';g.beginPath();g.moveTo(0,H*.35);g.lineTo(W,H*.35);g.moveTo(0,H*.76);g.lineTo(W,H*.76);g.stroke();if(analyser&&!audio.paused){analyser.getByteTimeDomainData(buffer);if(now-last>100){history.push(Array.from({length:220},(_,i)=>(buffer[Math.floor(i*(buffer.length-1)/219)]-128)/128));if(history.length>9)history.shift();last=now}}const signal=buffer?Array.from({length:440},(_,i)=>(buffer[Math.floor(i*(buffer.length-1)/439)]-128)/128):Array(440).fill(0);function trace(data,center,amp,color,width){g.beginPath();data.forEach((v,i)=>{const x=i/(data.length-1)*W,y=center-v*amp;i?g.lineTo(x,y):g.moveTo(x,y)});g.strokeStyle=color;g.lineWidth=width;g.stroke()}trace(signal,H*.35,H*.25,'#baf9ce',2);history.forEach((h,i)=>trace(h,H*.76,H*.17,`rgba(113,191,145,${.05+.25*(i+1)/history.length})`,1));g.fillStyle='#719783';g.font='13px monospace';g.fillText('A',12,22);g.fillText('B',12,H*.58);g.fillText('PROOF ≠ UNDERSTANDING',W-220,H-16)}requestAnimationFrame(render);
</script></body></html>
